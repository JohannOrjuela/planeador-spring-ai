spring.application.name=planeador-spring-ai

spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${MODELO_OLLAMA:qwen2.5:3b}
spring.ai.ollama.chat.temperature=0.0
spring.ai.ollama.chat.num-ctx=8192
spring.ai.ollama.init.pull-model-strategy=never

spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=600s

logging.level.com.example.chat=INFO
logging.level.org.springframework.ai=INFO

