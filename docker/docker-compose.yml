name: planeador-spring-ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pruebachat_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: pruebachat_ollama_pull
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5:3b"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build: ../backend
    container_name: pruebachat_backend
    ports:
      - "8080:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      MODELO_OLLAMA: qwen2.5:3b
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  frontend:
    build: ../frontend
    container_name: pruebachat_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  ollama_data:
    driver: local

